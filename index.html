<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Consultation</title>

  <style>
    body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}

.form-box {
  max-width: 500px;
  margin: 60px auto;
  background: white;
  padding: 35px;
  border-radius: 18px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.08);
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  color: #6b7280;
  margin: 10px 0 30px;
  line-height: 1.5;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: 600;
}

input,
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 15px;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: #555;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border: none;
  border-radius: 9px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

@media (max-width: 600px) {
  .form-box {
    margin: 20px auto;
    padding: 25px;
  }
}
  </style>
</head>

<body>

<div class="form-box">
  <h1>Request a Consultation</h1>
  <p class="subtitle">
    Tell us about your project and we’ll get back to you shortly.
  </p>

  <form action="https://webandelec.app.n8n.cloud/webhook/ai-lead" method="POST">


    <label>Name</label>
    <input type="text" name="name" minlength="2" maxlength="60" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Budget ($)</label>
    <input type="number" name="budget" min="0" max="1000000" required>

    <label>What do you need?</label>
    <textarea name="intent" minlength="10" maxlength="1000" rows="5" required></textarea>

    <button type="submit">Submit Request</button>

  </form>
</div>

</body>
</html>
